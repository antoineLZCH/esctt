name: Quality gates

on:
  pull_request:
    paths:
      - '.github/**'
      - 'apps/wordpress/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'compose.yml'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'apps/wordpress/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'compose.yml'

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  WP_ENV: testing
  WP_HOME: http://127.0.0.1:8080
  WP_SITEURL: http://127.0.0.1:8080/wp
  DB_NAME: esctt
  DB_USER: esctt
  DB_PASSWORD: esctt
  DB_HOST: 127.0.0.1:3307
  AUTH_KEY: ci
  SECURE_AUTH_KEY: ci
  LOGGED_IN_KEY: ci
  NONCE_KEY: ci
  AUTH_SALT: ci
  SECURE_AUTH_SALT: ci
  LOGGED_IN_SALT: ci
  NONCE_SALT: ci

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      shared: ${{ steps.filter.outputs.shared }}
      app: ${{ steps.filter.outputs.app }}
      theme: ${{ steps.filter.outputs.theme }}
      plugin: ${{ steps.filter.outputs.plugin }}
      php_dependencies: ${{ steps.filter.outputs.php_dependencies }}
      node_dependencies: ${{ steps.filter.outputs.node_dependencies }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/**'
              - 'apps/wordpress/**'
              - 'packages/**'
              - 'scripts/**'
              - 'tests/**'
              - 'playwright.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'compose.yml'
            shared:
              - '.github/**'
              - 'scripts/**'
              - 'tests/**'
              - 'playwright.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'compose.yml'
            app:
              - 'apps/wordpress/**'
            theme:
              - 'packages/theme/**'
            plugin:
              - 'packages/esctt-content/**'
            php_dependencies:
              - '**/composer.json'
              - '**/composer.lock'
            node_dependencies:
              - '**/package.json'
              - '**/pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  php:
    name: PHP tests and coverage
    needs: changes
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.app == 'true' ||
       needs.changes.outputs.theme == 'true' ||
       needs.changes.outputs.plugin == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: esctt
          MARIADB_USER: esctt
          MARIADB_PASSWORD: esctt
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, mysqli, zip, xdebug
          coverage: xdebug
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: apps/wordpress/vendor
          key: composer-v1-${{ runner.os }}-php-8.4-${{ hashFiles('apps/wordpress/composer.lock') }}
          restore-keys: |
            composer-v1-${{ runner.os }}-php-8.4-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm setup:site
      - run: bash scripts/ci/provision-wordpress.sh
      - run: pnpm test:coverage
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: apps/wordpress/build/coverage
          if-no-files-found: ignore
          retention-days: 3

  public:
    name: Public browser gates
    needs: changes
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.app == 'true' ||
       needs.changes.outputs.theme == 'true' ||
       needs.changes.outputs.plugin == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: esctt
          MARIADB_USER: esctt
          MARIADB_PASSWORD: esctt
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, mysqli, zip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: apps/wordpress/vendor
          key: composer-v1-${{ runner.os }}-php-8.4-${{ hashFiles('apps/wordpress/composer.lock') }}
          restore-keys: |
            composer-v1-${{ runner.os }}-php-8.4-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-v1-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm setup:site
      - run: bash scripts/ci/provision-wordpress.sh
      - run: bash scripts/ci/start-wordpress.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 3

  static:
    name: Static analysis
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, mysqli, zip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: apps/wordpress/vendor
          key: composer-v1-${{ runner.os }}-php-8.4-${{ hashFiles('apps/wordpress/composer.lock') }}
          restore-keys: |
            composer-v1-${{ runner.os }}-php-8.4-
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @esctt/wordpress composer:install
      - run: pnpm check:scaffold
      - run: pnpm check:php
      - run: pnpm test:js
        if: >-
          needs.changes.outputs.shared == 'true' ||
          needs.changes.outputs.theme == 'true'
      - run: pnpm check:static

  security:
    name: Security checks
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        if: needs.changes.outputs.php_dependencies == 'true'
        with:
          php-version: '8.4'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.node_dependencies == 'true'
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.node_dependencies == 'true'
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: composer audit --locked --no-interaction --abandoned=fail
        if: needs.changes.outputs.php_dependencies == 'true'
        working-directory: apps/wordpress
      - run: pnpm audit --audit-level=high
        if: needs.changes.outputs.node_dependencies == 'true'
      - name: Detect Dependency Graph support
        id: dependency-graph
        if: >-
          github.event_name == 'pull_request' &&
          (needs.changes.outputs.php_dependencies == 'true' ||
           needs.changes.outputs.node_dependencies == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.dependency_graph.status // "disabled"')"
          if [ "$status" = "enabled" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency Review skipped because Dependency Graph status is $status."
          fi
      - if: >-
          github.event_name == 'pull_request' &&
          steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality:
    name: Quality result
    if: always()
    needs: [changes, php, public, static, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require selected gates to pass
        if: >-
          needs.changes.result != 'success' ||
          (needs.changes.outputs.relevant == 'true' &&
           (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')))
        run: exit 1
      - run: echo 'Selected quality gates passed.'
